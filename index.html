<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Pseudo 3D Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="subwayCanvas" width="480" height="640"></canvas>
        
        <div id="ui-layer">
            <div class="hud">
                <div id="score-container">SCORE: <span id="score-val">00000</span></div>
                <div id="coins-container">🪙 <span id="coins-val">0</span></div>
            </div>
            
            <div id="game-over-screen" class="hidden">
                <div class="game-over-box">
                    <h1>BATEU!</h1>
                    <p>Sua pontuação total foi incrível.</p>
                    <div class="stats">
                        <p>Pontos: <span id="final-score">0</span></p>
                        <p>Moedas: <span id="final-coins">0</span></p>
                    </div>
                    <button id="restart-btn">JOGAR DE NOVO</button>
                    <small>Ou pressione ESPAÇO</small>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
